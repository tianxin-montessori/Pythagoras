<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>畢氏定理-等腰直角三角形嵌板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'jf-open-huninn';
            src: url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-font@1.1/font/jf-openhuninn.woff') format('woff'),
                 url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-font@1.1/font/jf-openhuninn.ttf') format('truetype');
            font-weight: normal; font-style: normal; font-display: swap;
        }

        body {
            touch-action: none;
            overflow: hidden;
            background-color: #d8ebef;
            font-family: 'jf-open-huninn', sans-serif;
            color: #4aabc4;
            letter-spacing: .05em;
            margin: 0;
        }
        svg {
            user-select: none;
            -webkit-user-select: none;
        }
        
        .draggable {
            cursor: grab;
            transition: filter 0.2s ease;
            filter: drop-shadow(0px 0px 2px rgba(0,0,0,0.4)) brightness(1);
        }
        
        .draggable:hover {
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.45)) brightness(1.05);
        }
        
        .draggable:active, .draggable.dragging {
            cursor: grabbing;
            filter: drop-shadow(3px 10px 15px rgba(0,0,0,0.5)) brightness(1.05) !important;
        }
        
        .animating {
            transition: transform 0.2s ease-out, filter 0.2s ease;
        }
        
        @keyframes popIn { 0%{transform:scale(.5);opacity:0} 100%{transform:scale(1);opacity:1} }
        .pop-in { animation: popIn .3s cubic-bezier(.175,.885,.32,1.275) forwards; transform-origin: 0 0; }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-2 md:p-5">

    <div class="w-full max-w-[1400px] flex flex-col h-full max-h-[900px]" style="gap: clamp(4px, 1vh, 12px);">
        
        <div class="w-full flex justify-between items-start mb-1 mt-2 flex-col md:flex-row gap-4 relative">
            
            <div class="hidden md:block md:w-[260px] lg:w-[280px]"></div>
            
            <div class="flex-grow text-center flex items-center justify-center md:mt-6">
                <h1 class="font-bold m-0" style="font-size: clamp(20px, 2.5vw, 30px); text-shadow: 1px 1px 2px rgba(0,0,0,.05); color: #4aabc4;">
                    畢氏定理-等腰直角三角形嵌板
                </h1>
            </div>

            <div id="hint-panel" class="w-full md:w-[260px] lg:w-[280px] flex-shrink-0 p-3 sm:p-4 bg-[#f5fafb] rounded-xl shadow-[0_4px_16px_rgba(0,0,0,0.15)] border-2 border-white/60 mt-0 z-10 pointer-events-none">
                <p style="color:#4aabc4; font-size:clamp(14px, 1.5vw, 15px); font-weight:bold; margin:0 0 8px; text-align:left;">💡 如何操作嵌板</p>
                <div style="display:flex; align-items:flex-start; gap:8px; color:#4b5563; font-size:clamp(12px, 1.3vw, 14px); line-height:1.5; margin-bottom:5px; text-align:left;">
                    <span style="flex-shrink:0; width:6px; height:6px; border-radius:50%; background:#4aabc4; margin-top:6px;"></span>
                    <span>按住：可移動</span>
                </div>
                <div style="display:flex; align-items:flex-start; gap:8px; color:#4b5563; font-size:clamp(12px, 1.3vw, 14px); line-height:1.5; margin-bottom:5px; text-align:left;">
                    <span style="flex-shrink:0; width:6px; height:6px; border-radius:50%; background:#4aabc4; margin-top:6px;"></span>
                    <span>點擊一下：旋轉 90°</span>
                </div>
                <div style="display:flex; align-items:flex-start; gap:8px; color:#4b5563; font-size:clamp(12px, 1.3vw, 14px); line-height:1.5; text-align:left;">
                    <span style="flex-shrink:0; width:6px; height:6px; border-radius:50%; background:#4aabc4; margin-top:6px;"></span>
                    <span class="whitespace-nowrap">長按後畫圈：可360°自由旋轉</span>
                </div>
            </div>
        </div>

        <div class="relative w-full flex-grow bg-[#7cb359] rounded-xl shadow-xl overflow-hidden flex items-center justify-center" style="min-height: 0;">
            
            <svg id="canvas" viewBox="200 25 1150 600" class="w-full h-full max-h-full">
                <defs>
                    <filter id="plate-3d" x="-10%" y="-10%" width="120%" height="120%">
                        <feOffset dx="1" dy="1" in="SourceAlpha" result="offAlpha1"/>
                        <feComposite operator="out" in="SourceAlpha" in2="offAlpha1" result="highlightMask"/>
                        <feFlood flood-color="#ffffff" flood-opacity="0.25" result="highlight"/>
                        <feComposite operator="in" in="highlight" in2="highlightMask" result="highLightBlend"/>

                        <feOffset dx="-1" dy="-1" in="SourceAlpha" result="offAlpha2"/>
                        <feComposite operator="out" in="SourceAlpha" in2="offAlpha2" result="shadowMask"/>
                        <feFlood flood-color="#000000" flood-opacity="0.3" result="shadow"/>
                        <feComposite operator="in" in="shadow" in2="shadowMask" result="shadowBlend"/>

                        <feGaussianBlur stdDeviation="0.3" in="highLightBlend" result="highLightBlur"/>
                        <feGaussianBlur stdDeviation="0.3" in="shadowBlend" result="shadowBlur"/>

                        <feMerge>
                            <feMergeNode in="SourceGraphic"/>
                            <feMergeNode in="highLightBlur"/>
                            <feMergeNode in="shadowBlur"/>
                        </feMerge>
                    </filter>
                </defs>

                <g id="static-layer">
                    <path d="M 275,250 L 425,250 L 575,100 L 725,250 L 575,400 L 575,550 L 425,550 L 425,400 L 275,400 Z" 
                          fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round" />
                    <path d="M 825,250 L 975,250 L 1125,100 L 1275,250 L 1125,400 L 1125,550 L 975,550 L 975,400 L 825,400 Z" 
                          fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round" />
                </g>

                <g id="pieces-layer"></g>

                <g id="rotate-ui-container" style="display:none" class="cursor-pointer">
                    <g id="rotate-ui-offset">
                        <g id="rotate-ui-anim">
                            <circle cx="0" cy="0" r="45" fill="transparent"/>
                            <circle cx="0" cy="0" r="24" fill="rgba(249,115,22,.75)" stroke="#fff" stroke-width="2" style="filter:drop-shadow(0 3px 5px rgba(0,0,0,.4))"/>
                            <path d="M -2,-12 A 12,12 0 1,1 -12,-2" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
                            <polygon points="-12,-6 -17,2 -7,2" fill="#fff"/>
                        </g>
                    </g>
                </g>
            </svg>
        </div>

        <div class="flex-shrink-0 flex items-center justify-center mt-2 mb-2 w-full">
            <button onclick="resetGame()" class="flex items-center justify-center gap-2 px-8 py-3 bg-[#4aabc4] hover:bg-[#3a9ab3] text-white font-bold rounded-xl shadow-[0_3px_12px_rgba(74,171,196,0.35)] transition-all duration-200 hover:-translate-y-[1px] active:scale-95" style="letter-spacing: .08em; border: none; font-family: inherit; font-size: clamp(14px,1.5vw,16px);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <path d="M3 3v5h5"></path>
                </svg>
                將所有嵌板歸位
            </button>
        </div>
    </div>

    <script>
        const HDL = {
            tri: { x: 0, y: 0 },
            square: { x: 0, y: 0 },
            redSquare: { x: 0, y: 0 }
        };

        const initialPiecesState = [
            { id: 'L_Blue', type: 'square', color: '#2a4db3', startX: 350, startY: 325, startRot: 0 },
            { id: 'L_Yellow', type: 'square', color: '#ffeb4c', startX: 500, startY: 475, startRot: 0 },
            { id: 'L_Red', type: 'redSquare', color: '#e64a38', startX: 575, startY: 250, startRot: 0 },
            { id: 'R_Blue_1', type: 'tri', color: '#2a4db3', startX: 870, startY: 355, startRot: 0 },
            { id: 'R_Blue_2', type: 'tri', color: '#2a4db3', startX: 930, startY: 295, startRot: 180 },
            { id: 'R_Yellow_1', type: 'tri', color: '#ffeb4c', startX: 1020, startY: 505, startRot: 0 },
            { id: 'R_Yellow_2', type: 'tri', color: '#ffeb4c', startX: 1080, startY: 445, startRot: 180 },
            { id: 'R_Red_1', type: 'tri', color: '#e64a38', startX: 1080, startY: 295, startRot: 180 },
            { id: 'R_Red_2', type: 'tri', color: '#e64a38', startX: 1080, startY: 205, startRot: 270 },
            { id: 'R_Red_3', type: 'tri', color: '#e64a38', startX: 1170, startY: 205, startRot: 0 },
            { id: 'R_Red_4', type: 'tri', color: '#e64a38', startX: 1170, startY: 295, startRot: 90 },
            { id: 'L_White', type: 'tri', color: '#ffffff', startX: 470, startY: 355, startRot: 0 },
            { id: 'R_White', type: 'tri', color: '#ffffff', startX: 1020, startY: 355, startRot: 0 },
        ];

        const snapPoints = {
            tri: [
                {x: 470, y: 355, rot: 0}, {x: 320, y: 355, rot: 0}, {x: 380, y: 295, rot: 180},
                {x: 470, y: 505, rot: 0}, {x: 530, y: 445, rot: 180}, {x: 620, y: 205, rot: 0},
                {x: 620, y: 295, rot: 90}, {x: 530, y: 295, rot: 180}, {x: 530, y: 205, rot: 270},
                {x: 1020, y: 355, rot: 0}, {x: 870, y: 355, rot: 0}, {x: 930, y: 295, rot: 180},
                {x: 1020, y: 505, rot: 0}, {x: 1080, y: 445, rot: 180}, {x: 1170, y: 205, rot: 0},
                {x: 1170, y: 295, rot: 90}, {x: 1080, y: 295, rot: 180}, {x: 1080, y: 205, rot: 270}
            ],
            square: [{x: 350, y: 325}, {x: 500, y: 475}, {x: 900, y: 325}, {x: 1050, y: 475}],
            redSquare: [{x: 575, y: 250}, {x: 1125, y: 250}]
        };

        let pieces = [];
        const canvas = document.getElementById('canvas');
        const piecesLayer = document.getElementById('pieces-layer');
        const rotUI = document.getElementById('rotate-ui-container');
        const rotOffset = document.getElementById('rotate-ui-offset');
        const rotAnim = document.getElementById('rotate-ui-anim');

        function initGame() {
            pieces = JSON.parse(JSON.stringify(initialPiecesState));
            pieces.forEach(p => { p.x = p.startX; p.y = p.startY; p.rot = p.startRot; });
            hideRotUI();
            renderPieces();
        }

        function renderPieces() {
            piecesLayer.innerHTML = '';
            pieces.forEach(p => {
                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.setAttribute("id", p.id);
                g.setAttribute("class", "draggable animating");
                g.setAttribute("data-id", p.id);
                
                let dotColor = '#1f2937'; 
                if (p.color === '#ffffff') dotColor = '#9ca3af'; 
                else if (p.color === '#2a4db3') dotColor = '#1e3a8a'; 
                else if (p.color === '#ffeb4c') dotColor = '#8a8253'; 
                else if (p.color === '#e64a38') dotColor = '#991b1b'; 

                let innerHTML = '';
                if (p.type === 'tri') {
                    innerHTML = `
                        <polygon points="-45,45 105,45 -45,-105" fill="${p.color}" filter="url(#plate-3d)" />
                        <circle cx="0" cy="0" r="4" fill="${dotColor}" />
                    `;
                } else if (p.type === 'square') {
                    innerHTML = `
                        <rect x="-75" y="-75" width="150" height="150" fill="${p.color}" filter="url(#plate-3d)" />
                        <circle cx="0" cy="0" r="4" fill="${dotColor}" />
                    `;
                } else if (p.type === 'redSquare') {
                    innerHTML = `
                        <polygon points="-150,0 0,150 150,0 0,-150" fill="${p.color}" filter="url(#plate-3d)" />
                        <circle cx="0" cy="0" r="4" fill="${dotColor}" />
                    `;
                }
                
                g.innerHTML = innerHTML;
                piecesLayer.appendChild(g);
                updatePieceTransform(p, false);
            });
        }

        function updatePieceTransform(piece, animate = false) {
            const el = document.getElementById(piece.id);
            if (!el) return;
            if (animate) el.classList.add('animating');
            else el.classList.remove('animating');
            el.setAttribute('transform', `translate(${piece.x}, ${piece.y}) rotate(${piece.rot})`);
        }

        function showRotUI(p) {
            const offset = HDL[p.type] || {x: 0, y: 0};
            rotOffset.setAttribute('transform', `translate(${offset.x}, ${offset.y})`);
            rotUI.style.display = '';
            rotAnim.classList.remove('pop-in');
            void rotAnim.offsetWidth; 
            rotAnim.classList.add('pop-in');
            moveRotUI(p);
        }

        function hideRotUI() {
            rotUI.style.display = 'none';
            rotHP = null;
        }

        function moveRotUI(p) {
            rotUI.setAttribute('transform', `translate(${p.x}, ${p.y}) rotate(${p.rot})`);
        }

        let activePiece = null;
        let startPointer = { x: 0, y: 0 };
        let startCli = { x: 0, y: 0 };
        let startPiecePos = { x: 0, y: 0 };
        let hasMoved = false;
        
        let lpTimer = null;
        let lpTriggered = false;
        let rotating = false;
        let rotHP = null;
        let prevAngle = 0;
        let rotated = false;

        function getSvgCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = 1150 / rect.width;
            const scaleY = 600 / rect.height;
            return {
                x: (clientX - rect.left) * scaleX + 200,
                y: (clientY - rect.top) * scaleY + 25
            };
        }

        function getClientPos(e) {
            if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            else if (e.changedTouches && e.changedTouches.length > 0) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
            return { x: e.clientX, y: e.clientY };
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#rotate-ui-container')) {
                e.preventDefault();
                canvas.setPointerCapture(e.pointerId);
                rotating = true;
                rotated = false;
                activePiece = rotHP;
                const c = getClientPos(e);
                startCli = { ...c };
                const sv = getSvgCoords(c.x, c.y);
                prevAngle = Math.atan2(sv.y - activePiece.y, sv.x - activePiece.x) * 180 / Math.PI;
                return;
            }

            const targetEl = e.target.closest('.draggable');
            if (!targetEl) { hideRotUI(); return; }
            
            e.preventDefault();
            canvas.setPointerCapture(e.pointerId);

            activePiece = pieces.find(p => p.id === targetEl.getAttribute('data-id'));
            if (!activePiece) return;

            if (rotHP !== activePiece) hideRotUI();

            targetEl.classList.remove('animating');
            targetEl.classList.add('dragging');
            piecesLayer.appendChild(targetEl);

            const c = getClientPos(e);
            startCli = { ...c };
            startPointer = getSvgCoords(c.x, c.y);
            startPiecePos = { x: activePiece.x, y: activePiece.y };
            hasMoved = false;
            lpTriggered = false;

            lpTimer = setTimeout(() => {
                if (hasMoved) return;
                lpTriggered = true;
                rotating = true;
                rotHP = activePiece;
                const sv = getSvgCoords(startCli.x, startCli.y);
                prevAngle = Math.atan2(sv.y - activePiece.y, sv.x - activePiece.x) * 180 / Math.PI;
                showRotUI(activePiece);
                if (navigator.vibrate) navigator.vibrate(50);
            }, 500);
        });

        canvas.addEventListener('pointermove', (e) => {
            const c = getClientPos(e);
            const dx = c.x - startCli.x;
            const dy = c.y - startCli.y;

            if (rotating && activePiece) {
                e.preventDefault();
                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) rotated = true;
                const sv = getSvgCoords(c.x, c.y);
                const d2 = Math.sqrt((sv.x - activePiece.x)**2 + (sv.y - activePiece.y)**2);
                if (d2 > 5) {
                    const ca = Math.atan2(sv.y - activePiece.y, sv.x - activePiece.x) * 180 / Math.PI;
                    let diff = ca - prevAngle;
                    if (diff > 180) diff -= 360;
                    else if (diff < -180) diff += 360;
                    activePiece.rot += diff;
                    prevAngle = ca;
                    updatePieceTransform(activePiece, false);
                    moveRotUI(activePiece);
                }
                return;
            }

            if (!activePiece) return;
            e.preventDefault();

            if (!hasMoved && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) {
                hasMoved = true;
                if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
                hideRotUI();
            }

            if (hasMoved && !lpTriggered) {
                const sv = getSvgCoords(c.x, c.y);
                activePiece.x = startPiecePos.x + (sv.x - startPointer.x);
                activePiece.y = startPiecePos.y + (sv.y - startPointer.y);
                updatePieceTransform(activePiece, false);
            }
        });

        canvas.addEventListener('pointerup', (e) => {
            if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }

            if (rotating) {
                rotating = false;
                canvas.releasePointerCapture(e.pointerId);
                if (!rotated && !lpTriggered) hideRotUI();
                else {
                    checkSnap(activePiece);
                    updatePieceTransform(activePiece, true);
                    moveRotUI(activePiece);
                }
                activePiece = null;
                return;
            }

            if (!activePiece) return;
            canvas.releasePointerCapture(e.pointerId);

            const targetEl = document.getElementById(activePiece.id);
            if (targetEl) targetEl.classList.remove('dragging');

            if (!hasMoved && !lpTriggered) {
                if (rotHP === activePiece) {
                    hideRotUI();
                } else {
                    activePiece.rot += 90; 
                    checkSnap(activePiece); 
                    updatePieceTransform(activePiece, true);
                }
            } else if (hasMoved) {
                checkSnap(activePiece);
                updatePieceTransform(activePiece, true);
            }
            
            activePiece = null;
        });

        function checkSnap(piece) {
            const points = snapPoints[piece.type];
            
            for (const pt of points) {
                const distance = Math.sqrt((piece.x - pt.x) ** 2 + (piece.y - pt.y) ** 2);

                if (distance < 50) {
                    if (piece.type === 'tri') {
                        const nr = ((piece.rot % 360) + 360) % 360;
                        let ad = Math.abs(nr - pt.rot);
                        if (ad > 180) ad = 360 - ad;
                        
                        if (ad < 30) {
                            const isOccupied = pieces.some(p => 
                                p.id !== piece.id && p.type === 'tri' &&
                                Math.abs(p.x - pt.x) < 5 && Math.abs(p.y - pt.y) < 5 && 
                                Math.abs((((p.rot % 360) + 360) % 360) - pt.rot) < 5
                            );
                            if (!isOccupied) {
                                piece.x = pt.x; piece.y = pt.y;
                                let tr = pt.rot;
                                while(tr - piece.rot > 180) tr -= 360;
                                while(piece.rot - tr > 180) tr += 360;
                                piece.rot = tr;
                                break;
                            }
                        }
                    } else {
                        let targetRot = Math.round(piece.rot / 90) * 90;
                        const isOccupied = pieces.some(p => 
                            p.id !== piece.id && p.type === piece.type &&
                            Math.abs(p.x - pt.x) < 5 && Math.abs(p.y - pt.y) < 5
                        );
                        if (!isOccupied) {
                            piece.x = pt.x; piece.y = pt.y; piece.rot = targetRot;
                            break;
                        }
                    }
                }
            }
        }

        window.resetGame = function() { initGame(); }
        initGame();
    </script>
</body>
</html>
